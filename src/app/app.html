<main>
  <h1>DSP Controller</h1>

  <p>
    DSP Status:
    {{ connected() ? 'CONNECTED' : 'DISCONNECTED' }}
  </p>

  <section class="channel">
    <h2>Input 1</h2>

    <div class="control gain-control">
      <label>Gain</label>

      <input
        class="gain-slider"
        type="range"
        min="-60"
        max="12"
        [value]="gain()"
        (input)="onGainChange($event)"
      />

      <span>{{ gain() }} dB</span>
    </div>

    <button (click)="toggleMute()">
      {{ muted() ? 'Unmute' : 'Mute' }}
    </button>
  </section>
</main>
